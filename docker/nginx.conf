# Same behaviour as firebase.json: single-page app fallback and an uncached service worker.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app uses the camera and microphone on its own origin only.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The service worker must always be fresh so new deploys reach users.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite puts content-hashed files in /assets, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else falls back to the app shell (client-side routing).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
