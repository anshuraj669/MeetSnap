# MeetSnap CI/CD
#
#  Every push and pull request:   type-check + build the web app, build the Docker image,
#                                 build the Android debug APK (when its config secret is set).
#  Every push to `main`:          deploy the tested web build + Firestore rules to the live
#                                 Firebase project → https://meetsnap-1f09da.web.app
#
# Setup (one time) is described in README.md → "CI/CD". Required repository secrets:
#   FIREBASE_SERVICE_ACCOUNT            JSON key of a deploy service account
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
#   VITE_RECAPTCHA_ENTERPRISE_SITE_KEY  public web config (from .env.local)
# Optional:
#   GOOGLE_SERVICES_JSON                contents of android/app/google-services.json (Android build)
#   ANDROID_APPCHECK_DEBUG_TOKEN        App Check debug token baked into the CI APK

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIREBASE_PROJECT: meetsnap-1f09da

jobs:
  # ---------------------------------------------------------------------------
  web:
    name: Web · type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build
        env:
          # Public Firebase web config. App Check debug tokens are never set here,
          # so the deployed site always uses real reCAPTCHA Enterprise attestation.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}

      - name: Refuse to ship a build without Firebase config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! grep -rq "${FIREBASE_PROJECT}" dist/assets; then
            echo "::error::dist/ has no Firebase config. Add the VITE_* repository secrets (see README → CI/CD)."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: meetsnap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  android:
    name: Android · debug APK
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      APPCHECK_TOKEN: ${{ secrets.ANDROID_APPCHECK_DEBUG_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Skip when the Firebase Android config is not configured
        id: cfg
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON secret not set, skipping the Android build."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.cfg.outputs.ok == 'true'

      - name: Write config files from secrets
        if: steps.cfg.outputs.ok == 'true'
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$APPCHECK_TOKEN" ]; then echo "appcheck.debugToken=$APPCHECK_TOKEN" >> local.properties; fi

      - name: Build debug APK
        if: steps.cfg.outputs.ok == 'true'
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: meetsnap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy · Firebase Hosting + Firestore rules
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://meetsnap-1f09da.web.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Use the exact build that passed CI
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Authenticate with the deploy service account
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing (see README → CI/CD)."
            exit 1
          fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive --force

      - name: Smoke-test the live site
        run: |
          sleep 5
          curl -fsS https://meetsnap-1f09da.web.app/ | grep -q "<title>MeetSnap" && echo "Live site is up."

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
